[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-faultsense"
version = "0.1.0"
description = "Explainable HVAC Fault Detection, Diagnosis & Early-Warning System"
authors = [{ name = "HVAC FaultSense Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

